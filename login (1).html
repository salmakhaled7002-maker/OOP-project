<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login — Jasr El Kheir</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<link rel="stylesheet" href="login.css">
</head>

<body>

<div class="page-wrap">

  <div class="login-header">

    <div class="logo-ring">🌉</div>

    <div class="brand-name-ar">جسر الخير</div>

    <div class="brand-name-en">Jasr El Kheir</div>

  </div>

  <div class="login-body">

    <h2 class="form-heading">Welcome Back</h2>

    <p class="form-sub">
      Sign in to continue your journey of kindness
    </p>

    <div class="field-group">

      <span class="field-label">Email Address</span>

      <div class="input-wrap">
        <i class="fa-solid fa-envelope"></i>

        <input
          type="email"
          placeholder="your@email.com"
          autocomplete="email"
        >
      </div>

    </div>

    <div class="field-group">

      <span class="field-label">Password</span>

      <div class="input-wrap">
        <i class="fa-solid fa-lock"></i>

        <input
          type="password"
          placeholder="••••••••"
          autocomplete="current-password"
        >
      </div>

    </div>

    <div class="remember-row">

      <input type="checkbox" id="remember">

      <label for="remember">
        Remember me on this device
      </label>

    </div>

    <button class="btn-login" type="button">
      <i class="fa-solid fa-shield"></i>
      Sign In Securely
    </button>

    <div class="gold-bar"></div>

    <p class="signup-link">
      Don't have an account?
      <a href="signup.html">Create one free</a>
    </p>

  </div>

</div>

</body>
</html>
