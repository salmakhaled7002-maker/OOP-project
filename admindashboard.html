<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Admin Dashboard
    </title>

    <link rel="stylesheet"
          href="admindashboard.css">

</head>

<body>

    <div class="sidebar">

        <div class="brand">

            <h1>
                Jisr Elkhair
            </h1>

        </div>

        <div class="nav">

            <a href="#"
               class="nav-item active"
               data-section="overview">

               Overview

            </a>

            <a href="#"
               class="nav-item"
               data-section="projects">

               Projects

            </a>

            <a href="#"
               class="nav-item"
               data-section="cases">

               Cases

            </a>

            <a href="#"
               class="nav-item"
               data-section="donors">

               Donors

            </a>

        </div>

    </div>

    <div class="main">

        <div class="topbar">

            <h2 id="pageTitle">
                Overview
            </h2>

            <div class="search-box">

                <input type="text"
                       placeholder="Search">

            </div>

        </div>

        <section class="section active"
                 id="section-overview">

            <div class="stats-grid">

                <div class="stat-card">

                    <h3>
                        Total Projects
                    </h3>

                    <p class="green">
                        2
                    </p>

                </div>

                <div class="stat-card">

                    <h3>
                        Cases
                    </h3>

                    <p class="gold">
                        1
                    </p>

                </div>

                <div class="stat-card">

                    <h3>
                        Donors
                    </h3>

                    <p class="blue">
                        0
                    </p>

                </div>

                <div class="stat-card">

                    <h3>
                        Donations
                    </h3>

                    <p class="red">
                        72500
                    </p>

                </div>

            </div>

            <div class="cards">

                <div class="card">

                    <h3>
                        Projects
                    </h3>

                    <div id="projectList"></div>

                </div>

                <div class="card">

                    <h3>
                        Cases
                    </h3>

                    <div id="caseListOverview"></div>

                </div>

            </div>

        </section>

        <section class="section"
                 id="section-projects">

            <div class="card">

                <h3>
                    Create Project
                </h3>

                <form id="createProjectForm">

                    <input type="text"
                           id="newProjectName"
                           placeholder="Project Name"
                           required>

                    <br><br>

                    <input type="text"
                           id="newProjectCategory"
                           placeholder="Category"
                           required>

                    <br><br>

                    <input type="number"
                           id="newProjectTarget"
                           placeholder="Target"
                           required>

                    <br><br>

                    <button type="submit"
                            class="btn">

                            Create

                    </button>

                </form>

            </div>

            <br>

            <div id="projectsGrid"
                 class="projects-grid"></div>

        </section>

        <section class="section"
                 id="section-cases">

            <div class="card">

                <h3>
                    Cases
                </h3>

                <table>

                    <thead>

                        <tr>

                            <th>ID</th>
                            <th>Name</th>
                            <th>Description</th>
                            <th>Status</th>
                            <th>Actions</th>

                        </tr>

                    </thead>

                    <tbody id="casesBody"></tbody>

                </table>

            </div>

        </section>

        <section class="section"
                 id="section-donors">

            <div class="card">

                <h3>
                    Donors
                </h3>

                <table>

                    <thead>

                        <tr>

                            <th>ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Wallet</th>
                            <th>Total</th>

                        </tr>

                    </thead>

                    <tbody id="donorsBody"></tbody>

                </table>

            </div>

        </section>

    </div>

    <script src="admindashboard.js"></script>

</body>

</html>
