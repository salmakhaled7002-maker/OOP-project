<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jasr Al-Khayr — Admin Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="adminlogin.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
   
</head>
<body>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <div class="login-container">
    <div class="login-card">
      <div class="brand">
        <div class="brand-icon">
          <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="20" cy="20" r="18" stroke="#c9a03d" stroke-width="2"/>
            <path d="M20 8 C14 8 10 13 10 18 C10 26 20 32 20 32 C20 32 30 26 30 18 C30 13 26 8 20 8Z" fill="#c9a03d" opacity="0.85"/>
            <circle cx="20" cy="18" r="4" fill="#0d2c33"/>
          </svg>
        </div>
        <span class="brand-ar">جسر الخير</span>
        <span class="brand-en">Jasr Al-Khayr</span>
        <div class="login-title">Administrator Portal</div>
      </div>

      <form id="loginForm">
        <div class="error-message" id="errorMessage">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <line x1="12" y1="8" x2="12" y2="12"/>
            <line x1="12" y1="16" x2="12.01" y2="16"/>
          </svg>
          <span id="errorText">Invalid credentials. Please try again.</span>
        </div>

        <div class="input-group">
          <label>Email / Username</label>
          <div class="input-wrapper">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
            <input type="text" id="username" placeholder="admin@jasralkhayr.org" value="admin@jasralkhayr.org">
          </div>
        </div>

        <div class="input-group">
          <label>Password</label>
          <div class="input-wrapper">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0110 0v4"/>
            </svg>
            <input type="password" id="password" placeholder="••••••••" value="admin123">
            <svg class="password-toggle" id="passwordToggle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </div>
        </div>

        <div class="options-row">
          <label class="remember-me">
            <input type="checkbox" id="rememberMe"> Remember me
          </label>
          <a href="#" class="forgot-link" id="forgotLink">Forgot password?</a>
        </div>

        <button type="submit" class="login-btn" id="loginBtn">
          Sign In
        </button>

        <div class="demo-hint">
          <strong>Demo Access</strong>
          <div class="demo-credentials">
            <span>📧 admin@jasralkhayr.org</span>
            <span>🔑 admin123</span>
          </div>
        </div>
      </form>

      <div class="footer-note">
        Secure administrator access only
      </div>
    </div>
  </div>

  <script>
    (function() {
      const loginForm = document.getElementById('loginForm');
      const usernameInput = document.getElementById('username');
      const passwordInput = document.getElementById('password');
      const errorMessageDiv = document.getElementById('errorMessage');
      const errorTextSpan = document.getElementById('errorText');
      const loginBtn = document.getElementById('loginBtn');
      const passwordToggle = document.getElementById('passwordToggle');
      const rememberMeCheckbox = document.getElementById('rememberMe');
      const forgotLink = document.getElementById('forgotLink');

      // Demo credentials
      const VALID_EMAIL = 'admin@jasralkhayr.org';
      const VALID_PASSWORD = 'admin123';

      // Toggle password visibility
      let passwordVisible = false;
      passwordToggle.addEventListener('click', function() {
        passwordVisible = !passwordVisible;
        if (passwordVisible) {
          passwordInput.type = 'text';
          passwordToggle.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><line x1="1" y1="1" x2="23" y2="23"/>';
        } else {
          passwordInput.type = 'password';
          passwordToggle.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
        }
      });

      // Load saved credentials if "Remember me" was checked
      function loadSavedCredentials() {
        const savedEmail = localStorage.getItem('admin_email');
        const savedPassword = localStorage.getItem('admin_password');
        const savedRemember = localStorage.getItem('admin_remember') === 'true';
        
        if (savedRemember && savedEmail) {
          usernameInput.value = savedEmail;
          if (savedPassword) passwordInput.value = savedPassword;
          rememberMeCheckbox.checked = true;
        }
      }
      loadSavedCredentials();

      // Show error with custom message
      function showError(message) {
        errorTextSpan.textContent = message;
        errorMessageDiv.classList.add('show');
        setTimeout(() => {
          errorMessageDiv.classList.remove('show');
        }, 4000);
      }

      // Hide error
      function hideError() {
        errorMessageDiv.classList.remove('show');
      }

      // Validate input
      function validateInputs() {
        const username = usernameInput.value.trim();
        const password = passwordInput.value.trim();
        
        if (!username) {
          showError('Please enter your email/username');
          return false;
        }
        if (!password) {
          showError('Please enter your password');
          return false;
        }
        return true;
      }

      // Handle successful login
      function handleLoginSuccess() {
        // Save credentials if "Remember me" is checked
        if (rememberMeCheckbox.checked) {
          localStorage.setItem('admin_email', usernameInput.value.trim());
          localStorage.setItem('admin_password', passwordInput.value.trim());
          localStorage.setItem('admin_remember', 'true');
        } else {
          localStorage.removeItem('admin_email');
          localStorage.removeItem('admin_password');
          localStorage.removeItem('admin_remember');
        }
        
        // Set session flag (optional, for additional security)
        sessionStorage.setItem('admin_logged_in', 'true');
        sessionStorage.setItem('admin_login_time', Date.now());
        
        // Redirect to dashboard
        window.location.href = 'admin-dashboard.html';
      }

      // Login submission handler
      loginForm.addEventListener('submit', function(e) {
        e.preventDefault();
        hideError();
        
        if (!validateInputs()) return;
        
        const username = usernameInput.value.trim();
        const password = passwordInput.value.trim();
        
        
        loginBtn.classList.add('loading');
        const originalBtnText = loginBtn.innerHTML;
        loginBtn.innerHTML = '<span>⟳</span> Signing in...';
        
    
        setTimeout(() => {
          // Check credentials
          if (username === VALID_EMAIL && password === VALID_PASSWORD) {
            handleLoginSuccess();
          } else {
            loginBtn.classList.remove('loading');
            loginBtn.innerHTML = originalBtnText;
            showError('Invalid email or password. Please use demo credentials shown below.');
          }
        }, 600);
      });

      // Forgot password demo handler
      forgotLink.addEventListener('click', function(e) {
        e.preventDefault();
        showError('Demo Mode: Use email: admin@jasralkhayr.org | password: admin123');
      });

      // Enter key support is already handled by form submission
      
      // Auto-focus on username field
      usernameInput.focus();

      // Prevent accidental form resubmission on page refresh
      if (window.history.replaceState) {
        window.history.replaceState(null, null, window.location.href);
      }

    
      const isLoggedIn = sessionStorage.getItem('admin_logged_in');
      const loginTime = sessionStorage.getItem('admin_login_time');
      const SESSION_DURATION = 8 * 60 * 60 * 1000; // 8 hours
      
      if (isLoggedIn === 'true' && loginTime && (Date.now() - parseInt(loginTime)) < SESSION_DURATION) {
        
        window.location.href = 'admin-dashboard.html';
      } else if (isLoggedIn === 'true') {
        // Session expired, clear it
        sessionStorage.removeItem('admin_logged_in');
        sessionStorage.removeItem('admin_login_time');
      }
    })();
  </script>
</body>
</html>
