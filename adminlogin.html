<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jasr Al-Khayr — Admin Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: linear-gradient(135deg, #0a2e3a 0%, #1a4a5a 50%, #0d3b44 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow-x: hidden;
    }

    /* Animated background pattern */
    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" opacity="0.08"><path fill="none" stroke="%23c9a03d" stroke-width="0.5" d="M20 20 L80 20 M20 30 L80 30 M20 40 L80 40 M20 50 L80 50 M20 60 L80 60 M20 70 L80 70 M20 80 L80 80 M30 20 L30 80 M40 20 L40 80 M50 20 L50 80 M60 20 L60 80 M70 20 L70 80 M80 20 L80 80"/><circle cx="50" cy="50" r="8" stroke="%23c9a03d" fill="none" stroke-width="0.5"/><path d="M50 42 L50 58 M42 50 L58 50" stroke="%23c9a03d" stroke-width="0.5"/></svg>');
      background-repeat: repeat;
      pointer-events: none;
    }

    /* Floating orbs animation */
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(60px);
      opacity: 0.3;
      animation: float 20s infinite ease-in-out;
    }

    .orb-1 {
      width: 300px;
      height: 300px;
      background: #c9a03d;
      top: -100px;
      left: -100px;
      animation-delay: 0s;
    }

    .orb-2 {
      width: 400px;
      height: 400px;
      background: #2a7a6e;
      bottom: -150px;
      right: -150px;
      animation-delay: 5s;
    }

    .orb-3 {
      width: 250px;
      height: 250px;
      background: #d4af37;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      animation-delay: 10s;
      opacity: 0.15;
    }

    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(30px, -30px) scale(1.05); }
      66% { transform: translate(-20px, 20px) scale(0.95); }
    }

    /* Login Card */
    .login-container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 450px;
      padding: 20px;
    }

    .login-card {
      background: rgba(15, 35, 40, 0.85);
      backdrop-filter: blur(12px);
      border-radius: 32px;
      padding: 40px 32px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(201, 160, 61, 0.2);
      transition: transform 0.3s ease;
    }

    .login-card:hover {
      transform: translateY(-5px);
    }

    /* Brand Section */
    .brand {
      text-align: center;
      margin-bottom: 36px;
    }

    .brand-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
    }

    .brand-icon svg {
      width: 64px;
      height: 64px;
      filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.3));
    }

    .brand-ar {
      display: block;
      font-family: 'Playfair Display', serif;
      font-size: 28px;
      font-weight: 700;
      color: #c9a03d;
      letter-spacing: 2px;
    }

    .brand-en {
      display: block;
      font-size: 12px;
      letter-spacing: 3px;
      color: rgba(255, 255, 255, 0.6);
      text-transform: uppercase;
      margin-top: 4px;
    }

    .login-title {
      text-align: center;
      font-size: 14px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.5);
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid rgba(201, 160, 61, 0.2);
    }

    /* Form Styles */
    .input-group {
      margin-bottom: 24px;
    }

    .input-group label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.7);
      margin-bottom: 8px;
      letter-spacing: 0.5px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-wrapper svg {
      position: absolute;
      left: 16px;
      width: 20px;
      height: 20px;
      stroke: rgba(201, 160, 61, 0.6);
      stroke-width: 1.5;
    }

    .input-wrapper input {
      width: 100%;
      padding: 14px 16px 14px 48px;
      background: rgba(10, 30, 35, 0.8);
      border: 1px solid rgba(201, 160, 61, 0.3);
      border-radius: 16px;
      color: white;
      font-size: 15px;
      font-family: 'DM Sans', sans-serif;
      transition: all 0.3s ease;
    }

    .input-wrapper input:focus {
      outline: none;
      border-color: #c9a03d;
      background: rgba(10, 30, 35, 0.95);
      box-shadow: 0 0 0 3px rgba(201, 160, 61, 0.2);
    }

    .input-wrapper input::placeholder {
      color: rgba(255, 255, 255, 0.3);
    }

    /* Password Toggle */
    .password-toggle {
      position: absolute;
      right: 16px;
      left: auto !important;
      cursor: pointer;
      stroke: rgba(255, 255, 255, 0.4);
      transition: stroke 0.2s;
    }

    .password-toggle:hover {
      stroke: #c9a03d;
    }

    /* Options Row */
    .options-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
      font-size: 13px;
    }

    .remember-me {
      display: flex;
      align-items: center;
      gap: 8px;
      color: rgba(255, 255, 255, 0.6);
      cursor: pointer;
    }

    .remember-me input {
      width: 16px;
      height: 16px;
      accent-color: #c9a03d;
      cursor: pointer;
    }

    .forgot-link {
      color: #c9a03d;
      text-decoration: none;
      font-size: 13px;
      transition: opacity 0.2s;
    }

    .forgot-link:hover {
      opacity: 0.8;
    }

    /* Login Button */
    .login-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #c9a03d 0%, #b88a2a 100%);
      border: none;
      border-radius: 40px;
      color: #0a2e3a;
      font-size: 16px;
      font-weight: 700;
      font-family: 'DM Sans', sans-serif;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-bottom: 20px;
      position: relative;
      overflow: hidden;
    }

    .login-btn::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.3);
      transform: translate(-50%, -50%);
      transition: width 0.5s, height 0.5s;
    }

    .login-btn:hover::before {
      width: 300px;
      height: 300px;
    }

    .login-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px -5px rgba(201, 160, 61, 0.4);
    }

    .login-btn:active {
      transform: translateY(0);
    }

    /* Error Message */
    .error-message {
      background: rgba(220, 38, 38, 0.2);
      border: 1px solid rgba(220, 38, 38, 0.5);
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 20px;
      display: none;
      align-items: center;
      gap: 10px;
      color: #f87171;
      font-size: 13px;
    }

    .error-message.show {
      display: flex;
    }

    .error-message svg {
      width: 18px;
      height: 18px;
      stroke: #f87171;
      flex-shrink: 0;
    }

    /* Demo credentials hint */
    .demo-hint {
      text-align: center;
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      font-size: 12px;
      color: rgba(255, 255, 255, 0.4);
    }

    .demo-hint strong {
      color: #c9a03d;
      font-weight: 500;
    }

    .demo-credentials {
      margin-top: 8px;
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .demo-credentials span {
      background: rgba(201, 160, 61, 0.15);
      padding: 4px 10px;
      border-radius: 20px;
      font-family: monospace;
      font-size: 11px;
    }

    /* Footer */
    .footer-note {
      text-align: center;
      margin-top: 24px;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.3);
    }

    /* Loading spinner */
    .login-btn.loading {
      pointer-events: none;
      opacity: 0.7;
    }

    .login-btn.loading span {
      display: inline-block;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <div class="login-container">
    <div class="login-card">
      <div class="brand">
        <div class="brand-icon">
          <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="20" cy="20" r="18" stroke="#c9a03d" stroke-width="2"/>
            <path d="M20 8 C14 8 10 13 10 18 C10 26 20 32 20 32 C20 32 30 26 30 18 C30 13 26 8 20 8Z" fill="#c9a03d" opacity="0.85"/>
            <circle cx="20" cy="18" r="4" fill="#0d2c33"/>
          </svg>
        </div>
        <span class="brand-ar">جسر الخير</span>
        <span class="brand-en">Jasr Al-Khayr</span>
        <div class="login-title">Administrator Portal</div>
      </div>

      <form id="loginForm">
        <div class="error-message" id="errorMessage">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <line x1="12" y1="8" x2="12" y2="12"/>
            <line x1="12" y1="16" x2="12.01" y2="16"/>
          </svg>
          <span id="errorText">Invalid credentials. Please try again.</span>
        </div>

        <div class="input-group">
          <label>Email / Username</label>
          <div class="input-wrapper">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
            <input type="text" id="username" placeholder="admin@jasralkhayr.org" value="admin@jasralkhayr.org">
          </div>
        </div>

        <div class="input-group">
          <label>Password</label>
          <div class="input-wrapper">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0110 0v4"/>
            </svg>
            <input type="password" id="password" placeholder="••••••••" value="admin123">
            <svg class="password-toggle" id="passwordToggle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </div>
        </div>

        <div class="options-row">
          <label class="remember-me">
            <input type="checkbox" id="rememberMe"> Remember me
          </label>
          <a href="#" class="forgot-link" id="forgotLink">Forgot password?</a>
        </div>

        <button type="submit" class="login-btn" id="loginBtn">
          Sign In
        </button>

        <div class="demo-hint">
          <strong>Demo Access</strong>
          <div class="demo-credentials">
            <span>📧 admin@jasralkhayr.org</span>
            <span>🔑 admin123</span>
          </div>
        </div>
      </form>

      <div class="footer-note">
        Secure administrator access only
      </div>
    </div>
  </div>

  <script>
    (function() {
      const loginForm = document.getElementById('loginForm');
      const usernameInput = document.getElementById('username');
      const passwordInput = document.getElementById('password');
      const errorMessageDiv = document.getElementById('errorMessage');
      const errorTextSpan = document.getElementById('errorText');
      const loginBtn = document.getElementById('loginBtn');
      const passwordToggle = document.getElementById('passwordToggle');
      const rememberMeCheckbox = document.getElementById('rememberMe');
      const forgotLink = document.getElementById('forgotLink');

      // Demo credentials
      const VALID_EMAIL = 'admin@jasralkhayr.org';
      const VALID_PASSWORD = 'admin123';

      // Toggle password visibility
      let passwordVisible = false;
      passwordToggle.addEventListener('click', function() {
        passwordVisible = !passwordVisible;
        if (passwordVisible) {
          passwordInput.type = 'text';
          passwordToggle.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><line x1="1" y1="1" x2="23" y2="23"/>';
        } else {
          passwordInput.type = 'password';
          passwordToggle.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
        }
      });

      // Load saved credentials if "Remember me" was checked
      function loadSavedCredentials() {
        const savedEmail = localStorage.getItem('admin_email');
        const savedPassword = localStorage.getItem('admin_password');
        const savedRemember = localStorage.getItem('admin_remember') === 'true';
        
        if (savedRemember && savedEmail) {
          usernameInput.value = savedEmail;
          if (savedPassword) passwordInput.value = savedPassword;
          rememberMeCheckbox.checked = true;
        }
      }
      loadSavedCredentials();

      // Show error with custom message
      function showError(message) {
        errorTextSpan.textContent = message;
        errorMessageDiv.classList.add('show');
        setTimeout(() => {
          errorMessageDiv.classList.remove('show');
        }, 4000);
      }

      // Hide error
      function hideError() {
        errorMessageDiv.classList.remove('show');
      }

      // Validate input
      function validateInputs() {
        const username = usernameInput.value.trim();
        const password = passwordInput.value.trim();
        
        if (!username) {
          showError('Please enter your email/username');
          return false;
        }
        if (!password) {
          showError('Please enter your password');
          return false;
        }
        return true;
      }

      // Handle successful login
      function handleLoginSuccess() {
        // Save credentials if "Remember me" is checked
        if (rememberMeCheckbox.checked) {
          localStorage.setItem('admin_email', usernameInput.value.trim());
          localStorage.setItem('admin_password', passwordInput.value.trim());
          localStorage.setItem('admin_remember', 'true');
        } else {
          localStorage.removeItem('admin_email');
          localStorage.removeItem('admin_password');
          localStorage.removeItem('admin_remember');
        }
        
        // Set session flag (optional, for additional security)
        sessionStorage.setItem('admin_logged_in', 'true');
        sessionStorage.setItem('admin_login_time', Date.now());
        
        // Redirect to dashboard
        window.location.href = 'admin-dashboard.html';
      }

      // Login submission handler
      loginForm.addEventListener('submit', function(e) {
        e.preventDefault();
        hideError();
        
        if (!validateInputs()) return;
        
        const username = usernameInput.value.trim();
        const password = passwordInput.value.trim();
        
        
        loginBtn.classList.add('loading');
        const originalBtnText = loginBtn.innerHTML;
        loginBtn.innerHTML = '<span>⟳</span> Signing in...';
        
    
        setTimeout(() => {
          // Check credentials
          if (username === VALID_EMAIL && password === VALID_PASSWORD) {
            handleLoginSuccess();
          } else {
            loginBtn.classList.remove('loading');
            loginBtn.innerHTML = originalBtnText;
            showError('Invalid email or password. Please use demo credentials shown below.');
          }
        }, 600);
      });

      // Forgot password demo handler
      forgotLink.addEventListener('click', function(e) {
        e.preventDefault();
        showError('Demo Mode: Use email: admin@jasralkhayr.org | password: admin123');
      });

      // Enter key support is already handled by form submission
      
      // Auto-focus on username field
      usernameInput.focus();

      // Prevent accidental form resubmission on page refresh
      if (window.history.replaceState) {
        window.history.replaceState(null, null, window.location.href);
      }

    
      const isLoggedIn = sessionStorage.getItem('admin_logged_in');
      const loginTime = sessionStorage.getItem('admin_login_time');
      const SESSION_DURATION = 8 * 60 * 60 * 1000; // 8 hours
      
      if (isLoggedIn === 'true' && loginTime && (Date.now() - parseInt(loginTime)) < SESSION_DURATION) {
        
        window.location.href = 'admin-dashboard.html';
      } else if (isLoggedIn === 'true') {
        // Session expired, clear it
        sessionStorage.removeItem('admin_logged_in');
        sessionStorage.removeItem('admin_login_time');
      }
    })();
  </script>
</body>
</html>
