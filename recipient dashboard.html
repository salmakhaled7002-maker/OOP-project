<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipient Dashboard - Jasr El Kheir</title>
    <link rel="stylesheet" href="recipient.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div class="dashboard-container">
        <aside class="sidebar">
            <div class="logo-section">
                <div class="logo-circle">🌉</div>
                <h2>Jasr El Kheir</h2>
            </div>
            <nav>
                <a href="#" class="active"><i class="fa-solid fa-house"></i> Overview</a>
                <a href="#" onclick="toggleModal('caseModal')"><i class="fa-solid fa-plus-circle"></i> New Case</a>
                <a href="login.html" class="logout"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
            </nav>
        </aside>

        <main class="main-content">
            <header>
                <h1>Welcome, <span id="displayUserName">Recipient</span></h1>
                <p>Manage your aid requests and track status.</p>
            </header>

            <div class="status-grid">
                <div class="card">
                    <h3>Active Cases</h3>
                    <div class="amount" id="caseCount">0</div>
                </div>
                <div class="card">
                    <h3>Aid Received</h3>
                    <div class="amount">0.00 EGP</div>
                </div>
            </div>

            <section class="table-section">
                <h2>Your Case History</h2>
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Title</th>
                            <th>Date</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="caseTableBody">
                        </tbody>
                </table>
            </section>
        </main>
    </div>

    <div id="caseModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="toggleModal('caseModal')">&times;</span>
            <h2>Submit New Case</h2>
            <form id="beneficiaryForm">
                <label>Case Title</label>
                <input type="text" id="caseTitle" placeholder="e.g. Medical Surgery" required>
                <label>Amount Needed (EGP)</label>
                <input type="number" id="caseAmount" placeholder="5000" required>
                <label>Details</label>
                <textarea id="caseDetails" rows="4" placeholder="Describe your situation..." required></textarea>
                <button type="button" class="btn-submit" onclick="submitNewCase()">Submit Case</button>
            </form>
        </div>
    </div>

    <script src="recipient.js"></script>
</body>
</html>
